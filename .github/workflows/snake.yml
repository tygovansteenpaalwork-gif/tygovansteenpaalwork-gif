name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ff3d00&color_dots=#ebedf0,#ffd0a8,#ff9b4a,#ff3d00,#b30000
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff7b00&color_dots=#161b22,#4d0a00,#b30000,#ff3d00,#ffb300&color_background=#0d0d0d

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
